# catalog.yaml — PE-owned SINGLE SOURCE OF TRUTH for shareable platform facts.
#
# Lives in platform-actions (Platform Engineering) and is read by the shared composite actions /
# reusable workflows in this repo (e.g. resolve-registry). Teams do NOT keep their own copy.
#
# STRUCTURE — a tree with a level for each scope, so a fact is set where it applies and inherited
# downward (no repetition across clusters):
#
#   defaults                      platform-wide
#   environments.<env>            env-level   (every cluster in that env)
#   environments.<env>.clouds.<cloud>
#                                 cloud-level (every cluster in that env+cloud)
#   environments.<env>.clouds.<cloud>.regions.<region>
#                                 region/cluster-level  (region == the cluster leaf)
#
# Each level carries its own inline facts PLUS the structural `clouds:` / `regions:` children.
#
# RESOLUTION — a consumer reads a fact at the DEEPEST level on the cluster's path that defines it
# (region > cloud > env > defaults). See actions/resolve-registry.
#
# Onboarding a cluster's registry = add its `regions.<region>.registry`. A fact shared by a whole
# env/cloud (e.g. a subscription, an account id) is set once at that level.
#
# Per-cluster registry values mirror what Terraform creates (platform-terraform:
# `output "acr_login_server"`), indexed by the cluster in platform-terraform/fleet.yaml.
apiVersion: platform/v1
kind: PlatformCatalog

defaults: # platform-wide
  org: imkrupakar
  tenant: 11111111-1111-1111-1111-111111111111

environments:
  sbx:
    clouds:
      azure:
        subscription: 00000000-0000-0000-0000-000000000000
        regions:
          centralus:
            registry: sbxacrplatform.azurecr.io
            resourceGroup: rg-platform-sbx-cus
      aws:
        account: "000000000000"
        regions:
          us-east-2:
            registry: 000000000000.dkr.ecr.us-east-2.amazonaws.com

  dev:
    clouds:
      azure:
        subscription: 00000000-0000-0000-0000-000000000000
        regions:
          centralus:
            registry: devacrplatform.azurecr.io
            resourceGroup: rg-platform-dev-cus
